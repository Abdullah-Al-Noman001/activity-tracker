<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Daily Habit Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Daily Habit Tracker</h1>

        <section class="card" id="globalSummaryCard" aria-labelledby="dashboardHeading" hidden>
            <h2 id="dashboardHeading">Global Activity Dashboard</h2>
            <div class="heatmap" aria-label="Activity over the last 16 weeks">
                <div class="grid" id="globalGrid"></div>
            </div>
            <div class="legend" aria-label="Activity level: less to more">
                <span>Less</span>
                <span class="legend-day level0"></span>
                <span class="legend-day level1"></span>
                <span class="legend-day level2"></span>
                <span class="legend-day level3"></span>
                <span class="legend-day level4"></span>
                <span>More</span>
            </div>
        </section>

        <section class="card" aria-label="Add a habit">
            <form class="input-row" id="addForm">
                <label class="sr-only" for="taskInput">Habit name</label>
                <input id="taskInput" type="text" placeholder="Add a habit..." maxlength="120" autocomplete="off" required>
                <button class="add-btn" type="submit">Add Habit</button>
            </form>
        </section>

        <section class="card" aria-labelledby="habitsHeading">
            <h2 id="habitsHeading">Habits</h2>
            <div id="taskList"></div>
        </section>

        <section class="card" aria-labelledby="backupHeading">
            <h2 id="backupHeading">Backup &amp; Restore</h2>
            <div class="input-row">
                <button class="export-btn" id="exportButton" type="button">Export backup</button>
                <button class="import-btn" id="importButton" type="button">Import backup</button>
                <input type="file" id="importFile" accept=".json,application/json" hidden>
            </div>
            <p class="help-text">Your data is stored in this browser. Export a backup to keep a copy or move it to another device.</p>
        </section>

        <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
    </main>
</body>
</html>
